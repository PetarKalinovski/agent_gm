# Agent-specific LLM configuration
# Models use LiteLLM format: provider/model-name
#
# Provider routing (detected from model prefix):
#   openrouter/...  → routes through OpenRouter (needs OPENROUTER_API_KEY)
#   anthropic/...   → direct Anthropic API (needs ANTHROPIC_API_KEY or setup-token)
#   openai/...      → direct OpenAI API (needs OPENAI_API_KEY)
#
# Examples:
#   - openrouter/anthropic/claude-sonnet-4-20250514   (Anthropic via OpenRouter)
#   - anthropic/claude-sonnet-4-20250514              (Anthropic direct)
#   - anthropic/claude-opus-4-6                       (Anthropic direct)
#   - openrouter/openai/gpt-4o                        (OpenAI via OpenRouter)
#   - openai/gpt-4o                                   (OpenAI direct)
#   - openrouter/deepseek/deepseek-v3.2               (DeepSeek via OpenRouter)

# Model tiering: the DM is where narrative quality matters most, so it gets
# the strongest (thinking) model. Sub-agents run inside a DM turn — every one
# is added latency the player feels — so they use a fast non-thinking model.
agents:
  dm_orchestrator:
    # 2026-09-11 playtest: trinity-large-thinking printed tool calls as text,
    # pasted tool results into prose, narrated in first person and invented
    # items in 4 of 4 turns; Claude Sonnet 5 via OpenRouter ran the same
    # turns with a clean audit. Override per process with
    # FORGE_MODEL_DM_ORCHESTRATOR=provider/model (see src/config.py).
    model: "openrouter/anthropic/claude-sonnet-5"
    temperature: 0.7
    max_tokens: 4096
    description: "Main dungeon master agent that narrates the world"

  npc_agent:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.8
    max_tokens: 2048
    description: "Handles NPC dialogue and personality"

  creator_agent:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.8
    max_tokens: 4096
    description: "On-demand world expansion during gameplay - lazy loading of locations, NPCs, quests"

  # Offscreen world simulation — runs once per in-game day in the background
  world_sim:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.7
    max_tokens: 2048
    description: "Advances faction goals, NPC agendas, and consequences while the player isn't looking"

  # "Previously on..." session recap — one fast call when resuming a world
  recap:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.6
    max_tokens: 512
    description: "Summarizes recent play into a short resume-session recap"

  # Campaign spine — ONE call at character creation, in the background
  campaign_forge:
    # 2026-09-11: deepseek stopped mid-JSON ("sequence":}}) and, on retry,
    # authored 3 usable beats of the 6 required — a new character played
    # with no story. One Sonnet call per character is cheap insurance.
    model: "openrouter/anthropic/claude-sonnet-5"
    temperature: 0.85
    max_tokens: 8192
    description: "Authors the three-act campaign, fixed truths, and story beats for a new character"

  # Ambient scene chatter — one background call per location, cached in the DB
  bark:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.9
    max_tokens: 600
    description: "Generates a pool of ambient one-liners for a location"

  # World Forge agents
  world_forge:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.8
    max_tokens: 4096
    description: "Master agent that generates entire game worlds from a premise"

  research_agent:
    model: "openrouter/deepseek/deepseek-v3.2"
    temperature: 0.5
    max_tokens: 4096
    description: "Research agent for gathering reference material from the web"
