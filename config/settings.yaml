# General application settings

database:
  # Path to SQLite database file (relative to project root)
  path: "data/game2.db"
  # Echo SQL queries for debugging
  echo: false

game:
  # Default time costs for actions (in hours)
  time_costs:
    conversation: 0.5      # 30 minutes
    short_travel: 1.0      # 1 hour (within city)
    long_travel: 8.0       # 8 hours (between cities)
    rest: 8.0              # Full rest
    combat: 0.25           # 15 minutes per encounter

  # How many recent messages to keep in NPC relationship context
  recent_messages_limit: 10

  # Trigger summary compression after this many messages with NPC
  summary_trigger_threshold: 20

# API configuration (keys should be in environment variables)
api:
  # Environment variable names for API keys
  openrouter_key_env: "OPENROUTER_API_KEY"
  anthropic_key_env: "ANTHROPIC_API_KEY"
  # OAuth setup-token from `claude setup-token` (sk-ant-oat01-*)
  # If set, uses Authorization: Bearer instead of x-api-key
  # Auto-detected from ANTHROPIC_API_KEY prefix if not set separately
  anthropic_auth_token_env: "ANTHROPIC_AUTH_TOKEN"
  openai_key_env: "OPENAI_API_KEY"

# Image generation configuration
image_generation:
  # Provider: "openrouter" or "gemini"
  provider: "gemini"
  # Model names per provider
  openrouter_model: "google/gemini-2.5-pro-image"
  # Must be an image-capable model. gemini-3.1-flash-image = "Nano Banana 2"
  # (better character consistency than Pro per community tests). The previous
  # "gemini-2.5-flash-image" SHUTS DOWN Oct 2, 2026. The "-preview" suffixed
  # IDs are all dead — use bare IDs. See docs/research/sprite_generation_models.md
  gemini_model: "gemini-3.1-flash-image"
  # Vision model for scene understanding (collision obstacle detection).
  # NOTE: "gemini-2.5-flash" is sunset — returns 404 for new users.
  vision_model: "gemini-3.5-flash"

# Audio: music palette (Suno) + NPC dialogue TTS (ElevenLabs / local Qwen3-TTS)
audio:
  music_enabled: true
  suno_key_env: "SUNO_API_KEY"
  suno_model: "V5"
  tts_enabled: true
  elevenlabs_key_env: "ELEVENLABS_API_KEY"
  elevenlabs_model: "eleven_v3"
  # Local voice-cloning server; used when reachable and the NPC has a
  # reference clip at data/assets/{world}/voices/refs/{npc_id}.wav
  qwen3_tts_url: "http://localhost:8002"
  max_tts_chars: 900
  # voice_pool: override the default ElevenLabs premade voices here
  # - voice_id: "..."
  #   name: "..."
  #   tags: "female young calm"

# Display settings
display:
  # Use rich formatting for CLI output
  use_rich: true
  # Color scheme
  theme: "monokai"
